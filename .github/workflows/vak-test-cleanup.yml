name: Factory Vāk test cleanup helper
on:
  pull_request:
    paths:
      - '.github/workflows/vak-test-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.head_ref == 'agent/aw94-cprime-orchestration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Remove obsolete helper and format
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('factory/tests/vak_orchestration.rs')
          text = path.read_text()
          dead = '''fn disposition(run: &Run, unit: Option<&WorkflowUnitRef>) -> ExecutionDisposition {\n    disposition_provider(run, unit, BTreeSet::new(), "factory-vak-test")\n}\n'''
          if dead not in text:
              raise SystemExit('expected obsolete helper not found')
          path.write_text(text.replace(dead, '', 1))
          PY
          cargo fmt --all
          git diff --check
          git config user.name 'Epii'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factory/tests/vak_orchestration.rs
          git commit -m 'test(vak): remove obsolete disposition helper'
          git push origin HEAD:${{ github.head_ref }}
