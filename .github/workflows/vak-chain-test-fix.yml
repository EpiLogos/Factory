name: Factory Vāk chain test fix
on:
  pull_request:
    paths:
      - '.github/workflows/vak-chain-test-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'agent/aw94-chain-input-close'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Rename shadowed chain plan fixture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('factory/tests/vak_orchestration.rs')
          text = p.read_text()
          start = text.index('fn melody_consumes_selected_current_predecessor_result_not_a_label_or_late_result()')
          end = text.index('\n#[test]\nfn fusion_preserves', start)
          block = text[start:end]
          old = '''    let plan = plan(\n        &workflow,\n        "CFP2",'''
          if old not in block:
              raise SystemExit('chain plan binding not found')
          block = block.replace(old, '''    let chain_plan = plan(\n        &workflow,\n        "CFP2",''', 1)
          block = block.replace('NativeVakPerformance::start(&mut orchestration, "journey:vak", plan, launches)',
                                'NativeVakPerformance::start(&mut orchestration, "journey:vak", chain_plan, launches)', 1)
          p.write_text(text[:start] + block + text[end:])
          PY
          cargo fmt --all
          git diff --check
          git config user.name 'Epii'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factory/tests/vak_orchestration.rs
          git commit -m 'test(vak): keep CFP2 negative fixture callable'
          git push origin HEAD:${{ github.head_ref }}
