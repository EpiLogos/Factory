name: Factory native Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate_factory_skills.py"
      - "factory/**"
      - ".github/workflows/factory-native-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/validate_factory_skills.py"
      - "factory/**"
      - ".github/workflows/factory-native-skills.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_factory_skills.py
