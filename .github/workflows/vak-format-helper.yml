name: Factory Vāk formatter helper
on:
  pull_request:
    paths:
      - '.github/workflows/vak-format-helper.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'agent/aw94-cprime-orchestration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Apply exact Rust formatting
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'Epii'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add factory/src/vak_orchestration.rs factory/src/vak_orchestration factory/src/orchestration_persistence.rs factory/tests/vak_orchestration.rs factory/src/lib.rs
            git commit -m 'style(vak): apply exact Rust 1.98.1 formatting'
            git push origin HEAD:${{ github.head_ref }}
          fi
