name: QL Series 1 Live

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Experiment ref to execute
        required: true
        default: ql/deep-runtime
        type: string
      host:
        description: Host profile to execute
        required: true
        default: all
        type: choice
        options: [all, pi, pydantic-ai, native]
      task:
        description: Benchmark task id or 'all'
        required: true
        default: all
        type: string
      repetitions:
        description: Repetitions per Classic/Direct/Deep condition (1 for exploratory human review)
        required: true
        default: '1'
        type: string
      max_steps:
        description: Identical recurrence budget for every matched condition
        required: true
        default: '16'
        type: string
      model:
        description: Candidate DeepSeek model id, identical across all conditions and hosts
        required: true
        default: deepseek-v4-flash
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-series1:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      QL_SERIES1_PROVIDER: deepseek
      QL_SERIES1_MODEL: ${{ inputs.model }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout experiment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Pi model stack
        working-directory: ql-agent-experiments/comparison/series1
        run: npm install --no-save --no-package-lock @earendil-works/pi-ai@0.84.1

      - name: Checkout pinned Pydantic AI
        uses: actions/checkout@v4
        with:
          repository: pydantic/pydantic-ai
          ref: 00db3a4b391eb9a46f3d6e704070bcf725121f75
          path: .series1/pydantic-ai

      - name: Install pinned Pydantic AI model stack
        run: |
          python -m pip install -e '.series1/pydantic-ai/pydantic_graph'
          python -m pip install -e '.series1/pydantic-ai/pydantic_ai_slim[openai]'

      - name: Preflight and execute matched benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p series1-evidence

          if [[ '${{ inputs.host }}' == 'all' ]]; then
            HOSTS=(pi pydantic-ai native)
          else
            HOSTS=('${{ inputs.host }}')
          fi

          if [[ '${{ inputs.task }}' == 'all' ]]; then
            TASKS=(
              S1-CODE-001
              S1-RESEARCH-001
              S1-EPISTEMIC-001
              S1-SKILL-001
              S1-AGENCY-001
              S1-RESTRAINT-001
            )
          else
            TASKS=('${{ inputs.task }}')
          fi

          node ql-agent-experiments/comparison/series1/preflight.mjs --live --task '${{ inputs.task }}' \
            | tee series1-evidence/preflight.json

          for HOST in "${HOSTS[@]}"; do
            for TASK in "${TASKS[@]}"; do
              OUT="series1-evidence/${HOST}-${TASK}-run.json"
              node ql-agent-experiments/comparison/series1/run.mjs \
                --host "$HOST" \
                --task "$TASK" \
                --repetitions '${{ inputs.repetitions }}' \
                --max-steps '${{ inputs.max_steps }}' \
                | tee "$OUT"
              node ql-agent-experiments/comparison/series1/render-review.mjs "$OUT" \
                > "series1-evidence/${HOST}-${TASK}-review.md"
            done
          done

      - name: Publish Series 1 human-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: ql-series1-human-review-${{ github.run_id }}
          path: series1-evidence/*
          if-no-files-found: error
