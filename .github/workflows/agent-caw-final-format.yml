name: Agent CAW final format

on:
  push:
    branches:
      - agent/caw-221-native-attempts

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/caw-221-native-attempts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact owner-contract and schema corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          owner = Path('factory/src/native_owner.rs')
          text = owner.read_text()
          old = '''    if let Some(authorization) = authorization {
              command.env("WORKCELL_CONTROL_TOKEN", authorization);
          }
          '''
          new = '''    if let Some(authorization) = authorization {
              command.arg("--authorization").arg(authorization);
          }
          '''
          if old not in text:
              raise SystemExit('expected Workcell authorization source shape not found')
          owner.write_text(text.replace(old, new))

          regressions = Path('factory/tests/attempt_public_regressions.rs')
          text = regressions.read_text()
          needle = '                artifact_refs: BTreeSet::from([artifact_ref]), evidence_refs: evidence, receiving_ref: None, archive_refs: BTreeSet::new(), regression_observation_refs: BTreeSet::new(),\n'
          replacement = '                artifact_refs: BTreeSet::from([artifact_ref]), evidence_refs: evidence, receiving_ref: None, receiving_source_revision: None, archive_refs: BTreeSet::new(), regression_observation_refs: BTreeSet::new(),\n'
          if needle not in text:
              raise SystemExit('expected ReadableReturn fixture source shape not found')
          regressions.write_text(text.replace(needle, replacement))
          PY
      - name: Format Factory Rust
        run: cargo fmt --manifest-path factory/Cargo.toml
      - name: Commit normalized implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add factory
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(factory): normalize combined native attempt implementation"
          git push origin HEAD:agent/caw-221-native-attempts
