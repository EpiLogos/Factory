name: Factory preparation source integration

on:
  push:
    branches: ['agent/caw-221-native-attempts']
    paths:
      - 'scripts/_factory_prepare_once.py'
      - '.github/workflows/factory-prepare-once.yml'
      - 'factory/tests/support/attempt_central_cases.rs'

permissions:
  contents: write

concurrency:
  group: factory-prepare-once
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factory
      - name: Apply exact inspected edits
        run: python3 scripts/_factory_prepare_once.py
      - name: Format native source
        run: cargo fmt --manifest-path factory/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path factory/Cargo.toml --all-targets -- -D warnings
      - name: Public native regressions
        run: cargo test --manifest-path factory/Cargo.toml --all-targets
      - name: Existing contract validators
        run: |
          python3 -m pip install --disable-pip-version-check 'jsonschema>=4.18,<5'
          python3 scripts/validate_agent_capability_intake.py
          python3 scripts/validate_routine_continuation.py
          python3 scripts/validate_self_hosting_commission.py
      - name: Commit verified native files and remove this one-shot helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factory
          git rm scripts/_factory_prepare_once.py .github/workflows/factory-prepare-once.yml
          git commit -m 'feat(factory): integrate native NOW preparation, fresh dispatch gates and recovery tests'
          git push origin HEAD:agent/caw-221-native-attempts
      - name: Retain candidate source on failure for inspection
        if: failure()
        run: |
          mkdir -p /tmp/factory-prepare-diagnostics
          git diff -- factory > /tmp/factory-prepare-diagnostics/candidate.patch
          tar -czf /tmp/factory-prepare-diagnostics/source.tar.gz factory/src factory/tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: factory-prepare-${{ github.run_id }}
          path: /tmp/factory-prepare-diagnostics/
          retention-days: 3
