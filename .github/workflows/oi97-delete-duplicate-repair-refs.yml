name: OI97 delete duplicate repair refs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oi97-delete-duplicate-repair-refs.yml'

permissions:
  contents: write

jobs:
  delete-verified-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify duplicate lineage and delete only exact accidental refs
        shell: bash
        run: |
          set -euo pipefail
          expected='1372e5861e6810a3f0915b6a7625d00836992480'
          refs=(
            repair/oi97-actuation-boundary-provenance-copy
            repair/oi97-actuation-boundary-provenance-final
            repair/oi97-actuation-boundary-provenance-pr
            repair/oi97-actuation-boundary-provenance-review
            repair/oi97-actuation-boundary-provenance-x
          )
          canonical="$(git ls-remote origin refs/heads/repair/oi97-actuation-boundary-provenance | awk '{print $1}')"
          test "$canonical" = "$expected"
          for ref in "${refs[@]}"; do
            actual="$(git ls-remote origin "refs/heads/$ref" | awk '{print $1}')"
            if [ -z "$actual" ]; then
              echo "$ref already absent"
              continue
            fi
            test "$actual" = "$expected"
          done
          for ref in "${refs[@]}"; do
            if git ls-remote --exit-code origin "refs/heads/$ref" >/dev/null 2>&1; then
              git push origin --delete "$ref"
            fi
          done
          for ref in "${refs[@]}"; do
            if git ls-remote --exit-code origin "refs/heads/$ref" >/dev/null 2>&1; then
              echo "duplicate ref survived deletion: $ref" >&2
              exit 1
            fi
          done
          echo 'All five accidental duplicate refs are absent; canonical repair ref preserved.'
