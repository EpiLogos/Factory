name: Factory native attempt evidence

on:
  pull_request:
    paths:
      - 'factory/**'
      - '.github/workflows/factory-native-evidence.yml'
  push:
    branches: ['agent/caw-221-native-attempts']
    paths:
      - 'factory/**'
      - '.github/workflows/factory-native-evidence.yml'

permissions:
  contents: read

jobs:
  native-attempt-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factory
      - name: Preserve exact source
        run: |
          mkdir -p native-evidence
          git rev-parse HEAD > native-evidence/source-sha.txt
          git archive HEAD | gzip > native-evidence/source.tar.gz
      - name: Format check
        id: format
        run: cargo fmt --manifest-path factory/Cargo.toml -- --check
      - name: Native all-target tests
        id: tests
        if: always()
        run: |
          set -o pipefail
          cargo test --manifest-path factory/Cargo.toml --all-targets 2>&1 | tee native-evidence/tests.log
      - name: Clippy
        if: always()
        run: cargo clippy --manifest-path factory/Cargo.toml --all-targets -- -D warnings
      - name: Build the exact Central consumer contract
        if: steps.tests.outcome == 'success'
        run: |
          git clone --no-checkout https://github.com/EpiLogos/Central.git "$RUNNER_TEMP/factory-central-owner"
          git -C "$RUNNER_TEMP/factory-central-owner" checkout --detach e7e8479f1502732821bd3e7d3d5ceda38fd4279f
          git -C "$RUNNER_TEMP/factory-central-owner" rev-parse HEAD > native-evidence/central-source-sha.txt
          cargo build --manifest-path "$RUNNER_TEMP/factory-central-owner/Cargo.toml" -p ctrl --locked
      - name: Real native Central to Factory preparation and dispatch gates
        if: steps.tests.outcome == 'success'
        env:
          FACTORY_REQUIRE_NATIVE_CTRL: '1'
        run: |
          set -o pipefail
          export FACTORY_TEST_CTRL="$RUNNER_TEMP/factory-central-owner/target/debug/ctrl"
          test -x "$FACTORY_TEST_CTRL"
          cargo test --manifest-path factory/Cargo.toml --test attempt_owner_delivery native_central_ -- --list > native-evidence/native-central-cases.txt
          test "$(grep -c '^central_cases::.*native_central_.*: test$' native-evidence/native-central-cases.txt)" = 7
          cargo test --manifest-path factory/Cargo.toml --test attempt_owner_delivery native_central_ -- --include-ignored --nocapture 2>&1 | tee native-evidence/native-central.log
      - name: Preserve successful native binary
        if: steps.tests.outcome == 'success'
        run: |
          target=$(cargo metadata --manifest-path factory/Cargo.toml --format-version 1 --no-deps | python3 -c 'import sys,json; print(json.load(sys.stdin)["target_directory"])')
          cp "$target/debug/factory" native-evidence/factory
          sha256sum native-evidence/factory > native-evidence/factory.sha256
      - name: Formatting diagnostics only
        if: always() && steps.format.outcome == 'failure'
        run: |
          cargo fmt --manifest-path factory/Cargo.toml
          git diff -- factory > native-evidence/rustfmt.patch
          tar -czf native-evidence/formatted-factory.tar.gz factory/src factory/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-native-${{ github.run_id }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 14
