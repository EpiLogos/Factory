name: Factory native attempt evidence

on:
  pull_request:
    paths:
      - 'factory/**'
      - 'contracts/factory/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/factory-native-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'factory/**'
      - 'contracts/factory/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/factory-native-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-attempt-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve exact source and prepare the inspected Central candidate
        run: |
          set -euo pipefail
          mkdir -p native-evidence "$RUNNER_TEMP/factory-central-owner"
          git rev-parse HEAD > native-evidence/source-sha.txt
          git archive HEAD | gzip > native-evidence/source.tar.gz
          git -C "$RUNNER_TEMP/factory-central-owner" init
          git -C "$RUNNER_TEMP/factory-central-owner" remote add origin https://github.com/EpiLogos/Central.git
          git -C "$RUNNER_TEMP/factory-central-owner" fetch --depth=1 origin 2a604574774c41921003ed99a2eed73b4c9f4266
          git -C "$RUNNER_TEMP/factory-central-owner" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/factory-central-owner" rev-parse HEAD > native-evidence/central-source-sha.txt
          test "$(cat native-evidence/central-source-sha.txt)" = 2a604574774c41921003ed99a2eed73b4c9f4266
      - name: Prepare exact Actuation authority owner for sensing integration
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/factory-actuation-owner"
          git -C "$RUNNER_TEMP/factory-actuation-owner" remote add origin https://github.com/EpiLogos/Actuation.git
          git -C "$RUNNER_TEMP/factory-actuation-owner" fetch --depth=1 origin 8ad34cb3df3cb9112c57f2db385e2d0bdd57a786
          git -C "$RUNNER_TEMP/factory-actuation-owner" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/factory-actuation-owner" rev-parse HEAD > native-evidence/actuation-source-sha.txt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: factory-native-attempt-integration
          cache-on-failure: true
          workspaces: |
            . -> target
            ${{ runner.temp }}/factory-central-owner -> target
            ${{ runner.temp }}/factory-actuation-owner -> target
      # Format, Clippy and all-target/doctests remain in required factory-rust.
      # This lane supplies native integration cases, including authenticated
      # decision and closure admission through the real Central owner.
      - name: Build exact native binaries
        run: |
          cargo build --locked --package epilogos-factory --bin factory
          cargo build --manifest-path "$RUNNER_TEMP/factory-central-owner/Cargo.toml" -p ctrl --locked
          cargo build --manifest-path "$RUNNER_TEMP/factory-actuation-owner/Cargo.toml" -p actuation-cli --bin actuation --locked
      - name: Real native Central to Factory preparation and dispatch gates
        id: integration
        env:
          FACTORY_REQUIRE_NATIVE_CTRL: '1'
        run: |
          set -euo pipefail
          export FACTORY_TEST_CTRL="$RUNNER_TEMP/factory-central-owner/target/debug/ctrl"
          test -x "$FACTORY_TEST_CTRL"
          cargo test --locked --manifest-path factory/Cargo.toml --test attempt_owner_delivery native_central_ -- --list > native-evidence/native-central-cases.txt
          test "$(grep -c '^central_cases::.*native_central_.*: test$' native-evidence/native-central-cases.txt)" = 9
          cargo test --locked --manifest-path factory/Cargo.toml --test attempt_owner_delivery native_central_ -- --include-ignored --nocapture 2>&1 | tee native-evidence/native-central.log
      - name: Real Central human decision and receiving closure admission
        env:
          FACTORY_REQUIRE_NATIVE_CTRL: '1'
        run: |
          set -euo pipefail
          export FACTORY_TEST_CTRL="$RUNNER_TEMP/factory-central-owner/target/debug/ctrl"
          test -x "$FACTORY_TEST_CTRL"
          cargo test --locked --manifest-path factory/Cargo.toml --test native_lifecycle_receiving -- --list > native-evidence/native-lifecycle-cases.txt
          test "$(grep -c ': test$' native-evidence/native-lifecycle-cases.txt)" = 9
          cargo test --locked --manifest-path factory/Cargo.toml --test native_lifecycle_receiving -- --include-ignored --nocapture 2>&1 | tee native-evidence/native-lifecycle-receiving.log
      - name: Real per-Run Flow association and changed-source gates
        env:
          FACTORY_REQUIRE_NATIVE_CTRL: '1'
        run: |
          set -euo pipefail
          export FACTORY_TEST_CTRL="$RUNNER_TEMP/factory-central-owner/target/debug/ctrl"
          test -x "$FACTORY_TEST_CTRL"
          export FACTORY_TEST_CTRL_SHA256="$(sha256sum "$FACTORY_TEST_CTRL" | cut -d ' ' -f 1)"
          export FACTORY_TEST_FLOW_TEMPLATE="$PWD/native-evidence/ql-flow.html"
          export FACTORY_TEST_FLOW_TEMPLATE_SHA256=2ccaa5f1e71a565ac0432216717c7d9ceda51c67beabb8c805d997fa1caf5478
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/EpiLogos/O-I/7dced5502f5057f951d58c3a6b199df26b4e6681/desktop/cradle/documents/ql-flow.html \
            --output "$FACTORY_TEST_FLOW_TEMPLATE"
          printf '%s  %s\n' "$FACTORY_TEST_FLOW_TEMPLATE_SHA256" "$FACTORY_TEST_FLOW_TEMPLATE" | sha256sum --check --strict
          printf '%s\n' 7dced5502f5057f951d58c3a6b199df26b4e6681 > native-evidence/flow-template-source-sha.txt
          sha256sum "$FACTORY_TEST_CTRL" "$FACTORY_TEST_FLOW_TEMPLATE" > native-evidence/flow-native-inputs.sha256
          mkdir -m 700 native-evidence/flow-captures
          export FACTORY_NATIVE_FLOW_EVIDENCE_DIR="$(pwd -P)/native-evidence/flow-captures"
          cargo test --locked -p epilogos-factory --test native_flow_association -- --list > native-evidence/native-flow-cases.txt
          test "$(grep -c ': test$' native-evidence/native-flow-cases.txt)" = 7
          cargo test --locked -p epilogos-factory --test native_flow_association -- --include-ignored --nocapture 2>&1 | tee native-evidence/native-flow.log
      - name: Real Actuation authority and Factory sensing integration
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/factory-actuation-owner/target/debug:$PATH"
          test -x "$RUNNER_TEMP/factory-actuation-owner/target/debug/actuation"
          cargo test --locked -p epilogos-factory --test sensing_public -- --nocapture 2>&1 | tee native-evidence/sensing-public.log
      - name: Preserve integration-tested native binary
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        run: |
          target=$(cargo metadata --locked --manifest-path factory/Cargo.toml --format-version 1 --no-deps | python3 -c 'import sys,json; print(json.load(sys.stdin)["target_directory"])')
          cp "$target/debug/factory" native-evidence/factory
          sha256sum native-evidence/factory > native-evidence/factory.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: factory-native-${{ github.run_id }}
          path: native-evidence/
          if-no-files-found: error
          retention-days: 14
