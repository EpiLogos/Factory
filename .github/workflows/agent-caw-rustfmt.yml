name: Agent CAW rustfmt

on:
  push:
    branches:
      - agent/caw-221-native-attempts

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/caw-221-native-attempts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply bounded compile fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('factory/src/attempt_runtime.rs')
          text = path.read_text()
          text = text.replace(
              'ExecutableOrchestration, ExecutionLaunch, LegRecord, LegStatus, OrchestrationError,',
              'ExecutableOrchestration, ExecutionLaunch, LegRecord, OrchestrationError,'
          )
          text = text.replace(
              '.create(true)\n        .read(true)\n        .write(true)\n        .open(lock_path)?;',
              '.create(true)\n        .truncate(false)\n        .read(true)\n        .write(true)\n        .open(lock_path)?;'
          )
          path.write_text(text)
      - name: Format Factory Rust
        run: cargo fmt --manifest-path factory/Cargo.toml
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add factory
          git commit -m "fix(factory): satisfy native attempt compile gate"
          git push origin HEAD:agent/caw-221-native-attempts
