name: Agent CAW rustfmt

on:
  push:
    branches:
      - agent/caw-221-native-attempts

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/caw-221-native-attempts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Factory Rust
        run: cargo fmt --manifest-path factory/Cargo.toml
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add factory
          git commit -m "style(factory): rustfmt CAW native attempt implementation"
          git push origin HEAD:agent/caw-221-native-attempts
