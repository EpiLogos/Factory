name: Agent CAW rustfmt

on:
  push:
    branches:
      - agent/caw-221-native-attempts

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/caw-221-native-attempts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply bounded attempt invariant fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path('factory/src/attempt_runtime.rs')
          text = path.read_text()

          text = text.replace(
              '    /// Central #152 receipt when that owner operation has actually occurred.\n    #[serde(default, skip_serializing_if = "Option::is_none")]\n    pub receiving_ref: Option<String>,\n',
              '    /// Central #152 receipt when that owner operation has actually occurred.\n    #[serde(default, skip_serializing_if = "Option::is_none")]\n    pub receiving_ref: Option<String>,\n    #[serde(default, skip_serializing_if = "Option::is_none")]\n    pub receiving_source_revision: Option<String>,\n'
          )
          text = text.replace(
              '    #[serde(default)]\n    pub reresolutions: Vec<ReresolutionRecord>,\n    #[serde(default, skip_serializing_if = "Option::is_none")]\n    pub readable_return: Option<ReadableReturn>,\n',
              '    #[serde(default)]\n    pub reresolutions: Vec<ReresolutionRecord>,\n    #[serde(default)]\n    pub failure_evidence_refs: BTreeSet<String>,\n    #[serde(default, skip_serializing_if = "Option::is_none")]\n    pub readable_return: Option<ReadableReturn>,\n'
          )
          text = text.replace(
              '            let mut launches = BTreeMap::new();\n            let mut records = Vec::new();\n            for start in &attempts {\n',
              '            let mut launches = BTreeMap::new();\n            let mut records = Vec::new();\n            let mut attempt_ids = BTreeSet::new();\n            let mut unit_ids = BTreeSet::new();\n            for start in &attempts {\n                if !attempt_ids.insert(start.attempt_ref.clone()) {\n                    return Err(FactoryAttemptError::DuplicateReference(start.attempt_ref.clone()));\n                }\n                if !unit_ids.insert(start.workflow_unit_ref.clone()) {\n                    return Err(FactoryAttemptError::InvalidOperation(\n                        "a fork cannot launch the same WorkflowUnit twice".into(),\n                    ));\n                }\n'
          )
          text = text.replace(
              '            engine.fail(&unit, reason)?;\n            attempt_refs.push(attempt_ref);\n',
              '            engine.fail(&unit, reason)?;\n            attempt_mut(state, &attempt_ref)?\n                .failure_evidence_refs\n                .extend(evidence_refs);\n            attempt_refs.push(attempt_ref);\n'
          )
          text = text.replace(
              '            let prior = latest_attempt_for_unit(state, &workflow_unit_ref)?;\n',
              '            let prior = current_attempt_for_unit(state, &engine, &workflow_unit_ref)?;\n'
          )
          text = text.replace(
              '            readable.receiving_ref = Some(receiving_ref);\n            readable.evidence_refs.extend(evidence_refs);\n',
              '            if readable\n                .receiving_source_revision\n                .as_deref()\n                .is_some_and(|current| current != source_revision)\n            {\n                return Err(FactoryAttemptError::InvalidOperation(\n                    "a different receiving source revision is already attached".into(),\n                ));\n            }\n            readable.receiving_ref = Some(receiving_ref);\n            readable.receiving_source_revision = Some(source_revision);\n            readable.evidence_refs.extend(evidence_refs);\n'
          )
          text = text.replace(
              '            reresolutions: Vec::new(),\n            readable_return: None,\n',
              '            reresolutions: Vec::new(),\n            failure_evidence_refs: BTreeSet::new(),\n            readable_return: None,\n'
          )

          old = '''fn latest_attempt_for_unit<'a>(
    state: &'a StoredAttemptState,
    unit: &WorkflowUnitRef,
) -> Result<&'a FactoryAttemptRecord, FactoryAttemptError> {
    state
        .attempts
        .values()
        .rev()
        .find(|record| &record.workflow_unit_ref == unit)
        .ok_or_else(|| FactoryAttemptError::InvalidOperation("no prior attempt for retry".into()))
}
'''
          new = '''fn current_attempt_for_unit<'a>(
    state: &'a StoredAttemptState,
    engine: &ExecutableOrchestration,
    unit: &WorkflowUnitRef,
) -> Result<&'a FactoryAttemptRecord, FactoryAttemptError> {
    let execution_ref = &engine
        .leg(unit)
        .ok_or_else(|| FactoryAttemptError::InvalidOperation("no current leg for retry".into()))?
        .execution_ref;
    state
        .attempts
        .values()
        .find(|record| {
            &record.workflow_unit_ref == unit
                && (record.execution_ref.as_deref() == Some(execution_ref.as_str())
                    || record.reserved_execution_ref == *execution_ref)
        })
        .ok_or_else(|| {
            FactoryAttemptError::CorruptState(
                "current coordinator execution has no durable attempt record".into(),
            )
        })
}
'''
          text = text.replace(old, new)

          marker = '        validate_disposition(&record.disposition, state.run.reference(), unit, None)?;\n'
          addition = '''        validate_disposition(&record.disposition, state.run.reference(), unit, None)?;
        if let Some(grant_ref) = &record.disposition.budget.retry_grant_ref {
            let grant = engine.retry_grant(grant_ref).ok_or_else(|| {
                FactoryAttemptError::CorruptState(
                    "attempt refers to a retry grant absent from the coordinator".into(),
                )
            })?;
            if record.disposition.budget.maximum_attempts != Some(grant.attempts_allowed) {
                return Err(FactoryAttemptError::CorruptState(
                    "attempt retry budget differs from the persisted grant".into(),
                ));
            }
        }
'''
          text = text.replace(marker, addition)
          path.write_text(text)
      - name: Format Factory Rust
        run: cargo fmt --manifest-path factory/Cargo.toml
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add factory
          git commit -m "fix(factory): harden durable attempt invariants"
          git push origin HEAD:agent/caw-221-native-attempts
