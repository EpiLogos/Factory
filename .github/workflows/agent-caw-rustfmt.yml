name: Agent CAW rustfmt

on:
  push:
    branches:
      - agent/caw-221-native-attempts
    paths:
      - factory/**
      - scripts/_caw_native_store_patch.py
      - .github/workflows/agent-caw-rustfmt.yml

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/caw-221-native-attempts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factory
          cache-on-failure: true
      - name: Integrate inspected native-store source edits
        run: python3 scripts/_caw_native_store_patch.py
      - name: Format Factory Rust
        run: cargo fmt --manifest-path factory/Cargo.toml
      - name: Commit native integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add factory
          git commit -m "feat(factory): integrate attempts into the canonical developmental store"
          git push origin HEAD:agent/caw-221-native-attempts
      - name: Format check
        run: cargo fmt --manifest-path factory/Cargo.toml -- --check
      - name: Test actual native operations
        run: cargo test --manifest-path factory/Cargo.toml --all-targets
      - name: Clippy
        if: always()
        run: cargo clippy --manifest-path factory/Cargo.toml --all-targets -- -D warnings
