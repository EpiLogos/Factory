name: Factory Rust

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "factory/**"
      - "contracts/factory/**"
      - "scripts/validate_agent_capability_intake.py"
      - ".github/workflows/factory-rust.yml"

env:
  CARGO_INCREMENTAL: "0"

jobs:
  factory-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            factory
          cache-on-failure: true
      - name: Format
        run: cargo fmt --manifest-path factory/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path factory/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path factory/Cargo.toml --all-targets
      - name: Agent capability intake conformance lane
        run: python3 scripts/validate_agent_capability_intake.py
