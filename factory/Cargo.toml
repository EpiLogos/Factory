[package]
name = "epilogos-factory"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

blake3 = "1"
fs2 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# Conformance only: validates emitted documents against the vendored frozen
# C0 schemas. Default features off keeps the dev tree small.
jsonschema = { version = "0.28", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
